project: fraud_detection

registry: 
  registry_type: sql
  path: postgresql+psycopg://feast:feast@postgres.feast.svc.cluster.local:5432/feast
  cache_ttl_seconds: 60
  sqlalchemy_config_kwargs:
    echo: false
    pool_pre_ping: true

provider: local

online_store:
  type: redis
  connection_string: redis.feast.svc.cluster.local:6379

offline_store:
  type: feast_trino.trino.TrinoOfflineStore
  host: trino-coordinator.trino.svc.cluster.local
  port: 8080
  catalog: delta_lake
  schema: default
  user: trino

entity_key_serialization_version: 3