apiVersion: v1
kind: Secret
metadata:
  name: feast-data-stores
  namespace: feast
stringData:
  # Redis config (used directly by Feast)
  redis: |
    connection_string: redis.feast.svc.cluster.local:6379

  # PostgreSQL config (used by registry)
  sql: |
    path: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.feast.svc.cluster.local:5432/${POSTGRES_DB}
    cache_ttl_seconds: 60
    sqlalchemy_config_kwargs:
        echo: false
        pool_pre_ping: true

  # Trino config (used for offline store)
  trino: |
    connector:
      type: trino
      config:
        host: trino-coordinator.trino.svc.cluster.local
        port: "8080"
        catalog: delta_lake
        schema: default
    auth:
      type: basic
      config:
        user: trino
        password: trino123
---
apiVersion: feast.dev/v1alpha1
kind: FeatureStore
metadata:
  name: fraud-detection
  namespace: feast
spec:
  feastProject: fraud_detection
  feastProjectDir:
    git:
      url: https://github.com/vuhuusy/data-lakehouse-platform
      ref: main
  services:
    offlineStore:
      persistence:
        store:
          type: trino
          secretRef:
            name: feast-data-stores
    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: feast-data-stores
      server:
        envFrom:
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: feast-data-stores
        env:
        - name: MPLCONFIGDIR
          value: /tmp
        resources:
          requests:
            cpu: 500m
            memory: 1024Mi
    registry:
      local:
        persistence:
          store:
            type: sql
            secretRef:
              name: feast-data-stores
