apiVersion: v1
kind: Service
metadata:
  name: kafka-to-minio-job-rest
  namespace: flink
  labels:
    type: flink-jobmanager-ui
spec:
  type: NodePort
  selector:
    app: flink
    component: jobmanager
    deployment-name: kafka-to-minio-job
  ports:
    - name: rest
      port: 8081
      targetPort: 8081
      nodePort: 31234