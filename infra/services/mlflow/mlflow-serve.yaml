apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-model-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlflow-serving
  template:
    metadata:
      labels:
        app: mlflow-serving
    spec:
      containers:
        - name: mlflow-serving
          image: huusy/mlflow:v2.12.1
          imagePullPolicy: Always
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlflow.svc.cluster.local:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "https://minio-api.minio.svc.cluster.local:9000"
            - name: AWS_ACCESS_KEY_ID
              value: "minio"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minio123"
            - name: MLFLOW_S3_IGNORE_TLS
              value: "true"
          ports:
            - containerPort: 8080
          command:
            - /bin/sh
            - -c
            - |
              python /app/log_model.py && \
              mlflow models serve -w $(nproc) -m 'models:/FraudDetectionXGBoost/Production' --no-conda --host 0.0.0.0 --port 8080
